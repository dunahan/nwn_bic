name: Create a release

# ponytail: Konsolidiert aus P0-P2.9 (siehe docs/nwn_bic-release-plan-status*.md
# fuer die volle Herleitung jeder Entscheidung). Dieser Kommentarblock nennt nur
# die Kurzfassung, damit die Datei selbst lesbar bleibt statt zum Essay zu werden.
#
# Struktur: build-linux-win (Matrix) -> smoke-test-windows (echter Runner, kein
# Wine) + build-macos -> release (packt, checkt, veroeffentlicht).

on:
  push:
    tags:
      - 'v*'  # Konvention, kein "jeder Tag loest aus" (P2.2)

permissions:
  contents: write  # GITHUB_TOKEN braucht das explizit fuer Release-Erstellung (P0.5)

jobs:
  build-linux-win:
    runs-on: ubuntu-latest  # ubuntu-18.04 existiert nicht mehr (P0.1)
    strategy:
      matrix:
        # Windows i386 bewusst gestrichen (Tobias, 2026-08-24): "die ueblichen
        # Binaries reichen, Spezialfaelle bei Bedarf selbst generieren."
        bintype: [linux, win-amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ vars.NIM_VERSION }}  # >= 2.0.0, siehe nwn_bic.nimble
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mingw
        if: matrix.bintype != 'linux'
        run: sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Install nimble packages
        # GCC-14/docopt.nim.c-Workaround (P0.4), betrifft real jeden C-Compile-
        # Schritt in der Kette (auch neverwinters vendorten zstd-Code), nicht nur docopt.
        run: nimble install --depsOnly -y --passNim:"--passC:-Wno-error=incompatible-pointer-types"

      - name: Compile for Linux
        if: matrix.bintype == 'linux'
        run: nimble build -d:release

      - name: Smoke test (Linux)
        if: matrix.bintype == 'linux'
        run: |
          set -eu
          ./bin/nwn_bic examples/bic/test1.bic
          test -s examples/bic/test1.txt
          grep -Fq 'BUILD DETAILS' examples/bic/test1.txt
          rm -f examples/bic/test1.txt

      - name: Upload Linux artifact
        if: matrix.bintype == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: nwn_bic.linux.amd64
          path: bin/*

      - name: Compile for Windows amd64
        if: matrix.bintype == 'win-amd64'
        # nwn_bic.nimble deklariert den `win`-Task bereits (-d:mingw --passL:-static
        # --dynlibOverrideAll): statisches Binary, nur KERNEL32.dll/msvcrt.dll noetig
        # (per objdump verifiziert). Kein dlls.zip, kein manuelles .exe-Rename noetig
        # (nim/nimble haengen .exe fuer ein Windows-Ziel bereits selbst an) (P1.1/P2.6).
        run: nimble win

      - name: Upload Windows amd64 artifact
        if: matrix.bintype == 'win-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: nwn_bic.windows.amd64
          path: bin/*

  smoke-test-windows:
    # Wine liefert fuer readGffRoots Seek-nach-Read-Muster falsche Werte (real
    # getestet), waere also ein irrefuehrender Test. Echter windows-latest-Runner
    # gegen das reale, cross-kompilierte Artefakt statt Emulation (P1.3).
    needs: build-linux-win
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nwn_bic.windows.amd64
          path: bin

      - name: Run against a real character
        shell: bash
        run: |
          set -eu
          ./bin/nwn_bic.exe examples/bic/test1.bic
          test -s examples/bic/test1.txt
          grep -Fq 'BUILD DETAILS' examples/bic/test1.txt
          rm -f examples/bic/test1.txt

  build-macos:
    runs-on: macos-latest  # arm64 bewusst zurueckgestellt (kein belegter Bedarf, YAGNI)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ vars.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble packages
        run: nimble install --depsOnly -y --passNim:"--passC:-Wno-error=incompatible-pointer-types"

      - name: Compile for macOS
        run: nimble build -d:release

      - name: Smoke test (macOS)
        run: |
          set -eu
          ./bin/nwn_bic examples/bic/test1.bic
          test -s examples/bic/test1.txt
          grep -Fq 'BUILD DETAILS' examples/bic/test1.txt
          rm -f examples/bic/test1.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: nwn_bic.macos.amd64
          path: bin/*

  release:
    needs: [build-linux-win, smoke-test-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7  # fuer nwn_bic.nimble (Version) + README/LICENSE

      - name: Tag/version check
        # Harter Fehlschlag statt Warnung (P2.3): Tag ohne passende .nimble-Version
        # darf keinen Release erzeugen. \K statt fixer Lookbehind-Breite, robust
        # gegen die tatsaechliche Leerzeichenzahl in "version       = ...".
        run: |
          set -eu
          nimble_version=$(grep -oP '^version\s*=\s*"\K[^"]+' nwn_bic.nimble)
          tag="${GITHUB_REF_NAME}"
          if [ "v$nimble_version" != "$tag" ] && [ "$nimble_version" != "$tag" ]; then
            echo "::error::tag '$tag' does not match nwn_bic.nimble version '$nimble_version' -- bump the version or fix the tag"
            exit 1
          fi

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: nwn_bic.linux.amd64
          path: bin-linux

      - name: Pack Linux artifact
        working-directory: bin-linux
        run: |
          chmod +x *
          cp ../README.md ../LICENSE .
          zip nwn_bic.linux.amd64.zip *

      - name: Download Windows amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: nwn_bic.windows.amd64
          path: bin-windows-amd64

      - name: Pack Windows amd64 artifact
        working-directory: bin-windows-amd64
        run: |
          cp ../README.md ../LICENSE .
          zip nwn_bic.windows.amd64.zip *

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: nwn_bic.macos.amd64
          path: bin-macos

      - name: Pack macOS artifact
        working-directory: bin-macos
        run: |
          chmod +x *
          cp ../README.md ../LICENSE .
          zip nwn_bic.macosx.amd64.zip *

      - name: Generate checksums
        # Eine kombinierte SHA256SUMS.txt (Go-Release-Konvention) statt einer
        # .sha256 pro Zip -- Verifikation ist "sha256sum -c" einmal, nicht dreimal (P2.1).
        run: |
          set -eu
          sha256sum bin-linux/*.zip bin-windows-amd64/*.zip bin-macos/*.zip \
            | sed -E 's| bin-[a-z0-9-]+/| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release
        # ponytail: NEU ggue. dem bisherigen Stand. v0.1.1.4 brach ab, weil
        # "gh release create" bei bereits existierendem Tag hart scheitert (kein
        # idempotenter Pfad). Fix: erst pruefen (gh release view), dann verzweigen
        # -- neu anlegen ODER Assets auf dem bestehenden Release ueberschreiben
        # (--clobber). Damit macht ein erneuter Tag-Push (Re-Run, Hotfix-Zip) den
        # Job nicht mehr kaputt. Siehe docs/nwn_bic-release-plan-status-p2-10.md
        # fuer die volle Herleitung und den offenen Verifikationsvorbehalt.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          files="bin-linux/nwn_bic.linux.amd64.zip bin-windows-amd64/nwn_bic.windows.amd64.zip bin-macos/nwn_bic.macosx.amd64.zip SHA256SUMS.txt"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists -- uploading/overwriting assets"
            gh release upload "$tag" $files --clobber
            url=$(gh release view "$tag" --json url -q .url)
          else
            url=$(gh release create "$tag" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --title "$tag" \
              $files)
          fi

          echo "release URL: $url"
          case "$url" in
            */releases/tag/"$tag") ;;
            *)
              echo "::error::release ended up at '$url', not under tag '$tag'"
              exit 1
              ;;
          esac
