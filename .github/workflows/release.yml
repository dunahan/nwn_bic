name: Create a release

on:
  push:
    tags:
      - '*'

# ponytail: P0.5 -- GITHUB_TOKEN needs this explicitly for release creation
# under default (read-only) repo permission settings.
permissions:
  contents: write

jobs:
  build-linux-win:
    # ponytail: P0.1 -- ubuntu-18.04 no longer exists as a hosted runner image.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bintype: [linux, win-i386, win-amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ponytail: P0.2/P0.3 -- same tool build.yml already uses. Replaces the
      # whole manual "download nim-$NIMVER, tar xf, set PATH" block below; the
      # action resolves and caches a real toolchain instead of a hardcoded,
      # now-incompatible 1.6.4 (nwn_bic.nimble requires nim >= 2.0.0).
      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ vars.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mingw
        if: matrix.bintype != 'linux'
        run: sudo apt-get install -y --no-install-recommends mingw-w64

      # ponytail: P0.4 -- same GCC-14/docopt.nim.c workaround build.yml already
      # carries. Verified LOCALLY that nwn_bic itself (src/nwn_bic.nim against
      # neverwinter 2.2.0) compiles clean under Nim 2.0.0 with this nim.cfg
      # flag, end-to-end against a real binary .bic built via the library's
      # own write()/gffRootFromJson(). NOT independently re-verified here that
      # this exact --passNim flag clears docopt.nim.c specifically under a
      # real `nimble install --depsOnly` run: this container has no working
      # network path to a full nimble self-build (nimble's own HEAD does not
      # self-compile cleanly against Nim 2.0.0 for unrelated reasons -- an
      # effect-checking issue in nimblepkg/download.nim, not a P0 concern).
      # Carried over as-is from the already-verified build.yml fix, same
      # dependency (neverwinter, same docopt requirement), same failure
      # class -- but flagged here as inherited, not independently reproduced.
      - name: Install nimble packages
        run: nimble install --depsOnly -y --passNim:"--passC:-Wno-error=incompatible-pointer-types"

      - name: Compile for Linux
        if: matrix.bintype == 'linux'
        run: nimble build -d:release

      - name: Upload Linux artifact
        if: matrix.bintype == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: nwn_bic.linux.amd64
          path: bin/*

      - name: Download Windows DLLs
        if: matrix.bintype == 'win-i386' || matrix.bintype == 'win-amd64'
        run: |
          mkdir dll
          cd dll
          wget https://nim-lang.org/download/dlls.zip
          unzip dlls.zip

      - name: Compile for Windows i386
        if: matrix.bintype == 'win-i386'
        # on Ubuntu the binary has no .exe extension for some reason
        run: |
          nimble build -d:release -d:mingw --cpu:i386
          for f in bin/*; do mv "$f" "$f.exe"; done
          for f in dll/*; do cp "$f" "bin/"; done

      - name: Upload Windows i386 artifact
        if: matrix.bintype == 'win-i386'
        uses: actions/upload-artifact@v4
        with:
          name: nwn_bic.windows.i386
          path: bin/*

      - name: Compile for Windows amd64
        if: matrix.bintype == 'win-amd64'
        run: |
          nimble build -d:release -d:mingw --cpu:amd64
          for f in bin/*; do mv "$f" "$f.exe"; done
          for f in dll/*; do cp "$f" "bin/"; done

      - name: Upload Windows amd64 artifact
        if: matrix.bintype == 'win-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: nwn_bic.windows.amd64
          path: bin/*

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ponytail: P0.2/P0.3 -- same as build-linux-win above. Replaces the
      # from-source Nim bootstrap (build.sh + koch boot + koch tools), which
      # was also pinned to the wrong (1.6.4) version and is ~10x slower than
      # this action. Kept as its own P1.2 follow-up to actually delete the
      # now-dead manual-build steps; this diff only fixes the P0 blockers.
      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ vars.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble packages
        run: nimble install --depsOnly -y --passNim:"--passC:-Wno-error=incompatible-pointer-types"

      - name: Compile for macOS
        run: nimble build -d:release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: nwn_bic.macos.amd64
          path: bin/*

  release:
    needs: [build-linux-win, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: nwn_bic.linux.amd64
          path: bin-linux

      - name: Pack Linux artifact
        # the executable flag is removed on artifact upload
        working-directory: bin-linux
        run: |
          chmod +x *
          zip nwn_bic.linux.amd64.zip *

      - name: Download Windows i386 artifact
        uses: actions/download-artifact@v4
        with:
          name: nwn_bic.windows.i386
          path: bin-windows-i386

      - name: Pack Windows i386 artifact
        working-directory: bin-windows-i386
        run: zip nwn_bic.windows.i386.zip *

      - name: Download Windows amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: nwn_bic.windows.amd64
          path: bin-windows-amd64

      - name: Pack Windows amd64 artifact
        working-directory: bin-windows-amd64
        run: zip nwn_bic.windows.amd64.zip *

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: nwn_bic.macos.amd64
          path: bin-macos

      - name: Pack macOS artifact
        working-directory: bin-macos
        run: |
          chmod +x *
          zip nwn_bic.macosx.amd64.zip *

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: true
          prerelease: false

      - name: Upload Linux release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: bin-linux/nwn_bic.linux.amd64.zip
          asset_name: nwn_bic.linux.amd64.zip
          asset_content_type: application/zip

      - name: Upload Windows i386 release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: bin-windows-i386/nwn_bic.windows.i386.zip
          asset_name: nwn_bic.windows.i386.zip
          asset_content_type: application/zip

      - name: Upload Windows amd64 release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: bin-windows-amd64/nwn_bic.windows.amd64.zip
          asset_name: nwn_bic.windows.amd64.zip
          asset_content_type: application/zip

      - name: Upload macOS release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: bin-macos/nwn_bic.macosx.amd64.zip
          asset_name: nwn_bic.macosx.amd64.zip
          asset_content_type: application/zip
