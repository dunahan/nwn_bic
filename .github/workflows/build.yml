name: Build and smoke test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: ${{ matrix.os }} / Nim ${{ vars.NIM_VERSION }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ vars.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain versions
        run: |
          nim -v
          nimble -v

      - name: Cache Nimble packages
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nim-${{ vars.NIM_VERSION }}-${{ hashFiles('nwn_bic.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nim-${{ vars.NIM_VERSION }}-
            ${{ runner.os }}-nim-

      - name: Install project dependencies
        run: nimble install --depsOnly -Y --passNim:"--passC:-Wno-error=incompatible-pointer-types"

      - name: Check Nim formatting
        shell: bash
        run: |
          set -eu

          nimpretty --backup:off src/*.nim

          if ! git diff --quiet -- src; then
            echo "Nim source files are not formatted with nimpretty."
            echo "Run the following command locally and commit the result:"
            echo "nimpretty --backup:off src/*.nim"
            git diff -- src
            exit 1
          fi

      - name: Build release binary
        run: nimble build -d:release -Y

      - name: Verify binary exists
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f bin/nwn_bic.exe
          else
            test -f bin/nwn_bic
          fi

      - name: Run CLI smoke test
        shell: bash
        run: |
          set -eu

          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="bin/nwn_bic.exe"
          else
            binary="bin/nwn_bic"
          fi

          # The CLI writes the output beside the input .bic file (P0.3 fix).
          # Move the generated file out of the checked-out tree afterward so
          # the repo working copy stays clean.
          smoke_dir="$RUNNER_TEMP/nwn_bic-smoke"
          mkdir -p "$smoke_dir"
          generated="$GITHUB_WORKSPACE/examples/bic/test.txt"
          "$binary" "$GITHUB_WORKSPACE/examples/bic/test.bic"

          test -f "$generated"
          test -s "$generated"
          grep -Fq 'IDENTITY' "$generated"
          grep -Fq 'FINAL BUILD' "$generated"
          grep -Fq 'ABILITIES' "$generated"
          grep -Fq 'STATISTICS' "$generated"

          mv "$generated" "$smoke_dir/test.txt"

      - name: Run larger-character smoke test
        shell: bash
        run: |
          set -eu

          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="bin/nwn_bic.exe"
          else
            binary="bin/nwn_bic"
          fi

          # No `cd` into an isolated dir needed here anymore: the CLI writes
          # beside the input file regardless of cwd (P0.3 fix), so the old
          # cwd-isolation trick was only ever a workaround for that bug.
          smoke_dir="$RUNNER_TEMP/nwn_bic-smoke-large"
          mkdir -p "$smoke_dir"
          generated="$GITHUB_WORKSPACE/examples/bic/test1.txt"
          "$GITHUB_WORKSPACE/$binary" "$GITHUB_WORKSPACE/examples/bic/test1.bic"
          test -f "$generated"
          test -s "$generated"
          grep -Fq 'IDENTITY' "$generated"
          grep -Fq 'FINAL BUILD' "$generated"
          grep -Fq 'Discipline: 4' "$generated"
          grep -Fq 'Armor Proficiency (light)' "$generated"
          grep -Fq 'BUILD DETAILS' "$generated"

          mv "$generated" "$smoke_dir/test1.txt"
