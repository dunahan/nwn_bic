name: Build and smoke test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: ${{ matrix.os }} / Nim ${{ vars.NIM_VERSION }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ vars.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain versions
        run: |
          nim -v
          nimble -v

      - name: Cache Nimble packages
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nim-${{ vars.NIM_VERSION }}-${{ hashFiles('nwn_bic.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nim-${{ vars.NIM_VERSION }}-
            ${{ runner.os }}-nim-

      - name: Install project dependencies
        run: nimble install --depsOnly -Y --passNim:"--passC:-Wno-error=incompatible-pointer-types"

      - name: Check Nim formatting
        shell: bash
        run: |
          set -eu

          nimpretty --backup:off src/*.nim

          if ! git diff --quiet -- src; then
            echo "Nim source files are not formatted with nimpretty."
            echo "Run the following command locally and commit the result:"
            echo "nimpretty --backup:off src/*.nim"
            git diff -- src
            exit 1
          fi

      - name: Build release binary
        run: nimble build -d:release -Y

      - name: Verify binary exists
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f bin/nwn_bic.exe
          else
            test -f bin/nwn_bic
          fi

      - name: Run CLI smoke test
        shell: bash
        run: |
          set -eu

          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="bin/nwn_bic.exe"
          else
            binary="bin/nwn_bic"
          fi

          # The current CLI writes the output beside the process working directory.
          # Keep the generated file outside the repository and verify it below.
          smoke_dir="$RUNNER_TEMP/nwn_bic-smoke"
          mkdir -p "$smoke_dir"
          "$binary" "$GITHUB_WORKSPACE/examples/bic/test.bic"

          test -f test.txt
          test -s test.txt
          grep -Fq 'IDENTITY' test.txt
          grep -Fq 'FINAL BUILD' test.txt
          grep -Fq 'ABILITIES' test.txt
          grep -Fq 'STATISTICS' test.txt

          mv test.txt "$smoke_dir/test.txt"

      - name: Run larger-character smoke test
        shell: bash
        run: |
          set -eu

          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="bin/nwn_bic.exe"
          else
            binary="bin/nwn_bic"
          fi

          smoke_dir="$RUNNER_TEMP/nwn_bic-smoke-large"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/$binary" "$GITHUB_WORKSPACE/examples/bic/test1.bic"
          test -f test1.txt
          test -s test1.txt
          grep -Fq 'IDENTITY' test1.txt
          grep -Fq 'FINAL BUILD' test1.txt
          grep -Fq 'Discipline: 4' test1.txt
          grep -Fq 'BUILD DETAILS' test1.txt
